# 출제 기준 — 지침·유의사항·스킬가이드 v8에서 옮긴 숫자 규칙과 루브릭.
# 대시보드 기본값과 검증 임계값은 모두 여기서 읽는다.

defaults:
  total: 300
  pool_extra_pct: 5            # 유의사항 "Pool은 조금 여유있게"
  difficulty_pct: {최상: 5, 상: 15, 중: 60, 하: 20}
  type_pct: {mcq: 50, ox: 30, short: 20}
  mcq_positive_pct: 20         # 지침: 옳은 것 고르기 20% / 옳지 않은 것 고르기 80%
  combo_pct: 10                # 선다형 중 ㄱㄴㄷㄹ 조합형 비율
  score: 5
  scoring: 시스템 자동채점
  numbering: continuous        # continuous(양식 연번) | per_type(지침 유형별)
  subject_prefix: false
  max_retries: 3
  difficulty_topup: false     # 배치 끝에 실제 난이도가 모자란 만큼 한 번 더 출제(실측: 효과 낮고 비용 +47% — 기본 끔)
  workers: 3
  fast_mode: false            # 빠른 출제: G4 독립 풀이·G5 검수(AI) 생략, 무료 검사(G1~G3·G6)는 유지 — 나중에 검증 가능
  difficulty_calibrate: true  # 난이도 보정 출제: AI 검수가 낮게 판정하는 만큼 어려운 슬롯을 더 배정(plan/calibrate.py)

# 난이도 보정 출제 기본 판정 비율표: 슬롯 난이도 → AI 검수(G5) 실제 판정 비율.
# 개발 시험 실측(2026-10-27~28, Opus 5.5, 같은 원고 4회 182문항). 이 PC 출제 기록이 쌓이면 기록과 섞어 쓴다.
difficulty_calibration:
  since: "2026-10-27"          # 이 프롬프트 버전 이후 문항만 기록으로 센다(최상 루브릭 변경 이후)
  table:
    최상: {최상: 0.07, 상: 0.93, 중: 0.0, 하: 0.0}    # 15문항
    상: {최상: 0.0, 상: 0.06, 중: 0.94, 하: 0.0}      # 36문항
    중: {최상: 0.0, 상: 0.0, 중: 0.58, 하: 0.42}      # 98문항
    하: {최상: 0.0, 상: 0.0, 중: 0.09, 하: 0.91}      # 33문항

type_names: {mcq: 선다형, ox: 진위형, short: 단답형}
type_order: [mcq, ox, short]
difficulty_levels: [최상, 상, 중, 하]

# 난이도 기준안 — 블룸 인지 수준(기억·이해·적용·분석/종합)에 맞춘 개발 기준안(2026-10-30).
# 받은 기준 문서에는 비율만 있고 정의가 없다. 담당자가 '난이도 기준' 화면에서 고치거나 확정하면 그 내용(data/difficulty_policy.json)을 쓴다.
difficulty_rubric:
  하: (기억) 원고의 핵심 용어·정의·분류나 명시된 사실 하나를 떠올리면 풀린다(원고를 덮고 시험 보는 학습자 기준).
  중: (이해) 의미를 이해해야 풀린다. 비슷한 두 개념·시기·대상의 구분, 원고의 다른 항목과 바꾼 진술 판별, 다르게 표현한 문장의 뜻 확인.
  상: (적용) 원칙·기준을 짧은 상황에 적용하거나, 둘 이상의 항목·문단을 연결해야 풀린다. 단계·유형 간 비교, 원인과 결과·목적과 수단 연결.
  최상: >-
    (분석·종합, 자격시험형 — 담당자 협의 2026-10-23) 실무 사례(고객·거래·업무 상황과 조건·수치)에서 조건을 따져
    원고의 개념·절차·기준 2개 이상을 이어서 적용해야 풀린다. 보기는 모두 실무에서 그럴듯한 대응·판단이고,
    원고 내용 하나를 떠올리거나 문장 하나와 대조해서는 풀 수 없다. 사례 없이 진술만 판별하는 문항은 '상'까지다.
    원고 밖 지식·지엽적 세부는 요구하지 않는다(사례의 사실관계는 문항 안에서 모두 주어진다).

trap_types: [정반대, 수치 변형, 주체·객체 뒤바꿈, 일부만 옳음, 다른 항목에 속하는 내용]

# 표현 정확도 (인계 docs/02 5절): 정답 진술에서 원문의 양태 표현을 바꾸면 안 된다.
modality_groups:
  의무: ["해야 한다", "하여야 한다", "해야만 한다"]
  금지: ["해서는 안 된다", "하면 안 된다", "금지된다"]
  가능: ["할 수 있다", "가능하다"]
  권고: ["권장한다", "권장된다", "바람직하다"]

absolute_words: [항상, 절대, 절대로, 반드시, 전혀, 언제나, 결코, 오직, 모든]

thresholds:
  evidence_min_coverage: 0.8   # 인용문 글자 중 원고에서 찾은 비율 (L1 부분 일치 하한)
  dedup_block: 0.72            # xam-local 실측값
  dedup_warn: 0.58
  choice_length_ratio_warn: 3.0
  page_cap_factor: 2.0         # 페이지당 최대 = 기대값 × 2
  min_page_chars: 80           # 이보다 글자가 적은 페이지는 기본 제외
  autostop_evidence_rate: 0.8  # 첫 시도 근거 매칭률이 이 값보다 낮으면 자동 중단
  autostop_check_after_pages: 3

colors:
  correct: [1.0, 0.95, 0.0]
  wrong: [0.35, 0.6, 1.0]        # 함정 원문: 파랑(정답 근거 노랑과 확실히 구분 — 담당자 협의 2026-10-23)
  label_correct: [0.6, 0.5, 0.0]
  label_wrong: [0.1, 0.3, 0.8]
  bg_correct: [1.0, 0.97, 0.85]
  bg_wrong: [0.88, 0.93, 1.0]
  opacity: 0.4

fonts:
  regular: C:/Windows/Fonts/malgun.ttf
  bold: C:/Windows/Fonts/malgunbd.ttf
